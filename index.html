<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triple S Cafe - Fast Food</title>
  <style>
    :root {
      --primary: #e63946;
      --primary-hover: #d62828;
      --secondary: #1d3557;
      --light-bg: #f8f9fa;
      --card-bg: #ffffff;
      --accent: #ffb703;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--light-bg);
      color: #333;
      padding-bottom: 95px;
    }
    header {
      background: linear-gradient(135deg, var(--secondary), #0d1b2a);
      color: white;
      text-align: center;
      padding: 24px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    header h1 {
      font-size: 26px;
      letter-spacing: 1.5px;
      color: var(--accent);
      font-weight: 800;
      text-transform: uppercase;
    }
    header p {
      font-size: 13px;
      color: #e0e1dd;
      margin-top: 4px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
    }
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #e9ecef;
      overflow: hidden;
    }
    .card-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
      background-color: #f1f3f5;
    }
    .tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-block;
      width: fit-content;
      margin-bottom: 8px;
      font-weight: bold;
      background: #ffe3e3;
      color: #c92a2a;
    }
    .item-name {
      font-size: 16px;
      font-weight: 700;
      color: #111;
      margin-bottom: 4px;
      white-space: normal;
      word-wrap: break-word;
      line-height: 1.3;
    }
    .item-desc {
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .price-action {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid #f1f3f5;
    }
    .price {
      font-size: 17px;
      font-weight: 800;
      color: var(--secondary);
    }
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-qty {
      background: #e9ecef;
      border: 1px solid #ced4da;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qty-num {
      font-weight: 700;
      min-width: 16px;
      text-align: center;
      font-size: 14px;
    }
    .add-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 7px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      transition: background 0.2s;
    }
    .add-btn:active {
      transform: scale(0.96);
    }
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      box-shadow: 0 -4px 14px rgba(0,0,0,0.12);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .cart-info {
      font-size: 15px;
      font-weight: 700;
      color: #222;
    }
    .checkout-btn {
      background: #25d366;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .checkout-btn:hover {
      background: #1eb956;
    }
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.65);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 22px;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h2 {
      font-size: 20px;
      margin-bottom: 12px;
      color: var(--secondary);
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #555;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 14px;
    }
    .order-summary-box {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 13px;
      border: 1px solid #e9ecef;
      line-height: 1.5;
    }
    .submit-order-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 14px;
      color: #666;
      width: 100%;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Triple S Cafe</h1>
    <p>Hot & Fresh Fast Food | Instant Home Delivery</p>
  </header>

  <div class="container">
    <div class="items-grid" id="menuGrid"></div>
  </div>

  <!-- Bottom Cart Notification Bar -->
  <div class="cart-bar" id="cartBar" style="display: none;">
    <div class="cart-info">
      <span id="totalItems">0</span> Items | Total: ₹<span id="totalPrice">0</span>
    </div>
    <button class="checkout-btn" onclick="openOrderModal()">
      Place Order ➔
    </button>
  </div>

  <!-- Order Modal Form -->
  <div class="modal" id="orderModal">
    <div class="modal-content">
      <h2>Complete Your Order</h2>
      <div class="order-summary-box" id="orderSummaryText"></div>

      <form id="orderForm" action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST">
        <input type="hidden" name="Order_Items" id="hiddenOrderDetails">
        <input type="hidden" name="Total_Amount" id="hiddenTotalBill">

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="Customer_Name" required placeholder="Enter full name">
        </div>

        <div class="form-group">
          <label>Mobile Number</label>
          <input type="tel" name="Customer_Phone" required placeholder="10-digit mobile number">
        </div>

        <div class="form-group">
          <label>Delivery Address</label>
          <textarea name="Customer_Address" rows="3" required placeholder="House/Flat No., Street, Landmark"></textarea>
        </div>

        <div class="form-group">
          <label>Payment Method</label>
          <input type="text" name="Payment_Method" value="Cash / UPI on Delivery" readonly>
        </div>

        <button type="submit" class="submit-order-btn" id="submitBtn">Confirm & Send Order</button>
        <button type="button" class="close-btn" onclick="closeOrderModal()">Cancel</button>
      </form>
    </div>
  </div>

  <script>
    // Exact Photos from user upload
    const PATTIES_IMAGE = "https://images.unsplash.com/photo-1628088062854-d1870b4553da?w=500&auto=format&fit=crop&q=80"; // Crispy triangular puff patties
    const CHILLI_POTATO_IMAGE = "https://images.unsplash.com/photo-1625813506062-0aeb1d7a094b?w=500&auto=format&fit=crop&q=80"; // Honey chilli potato dish

    const products = [
      { 
        id: 1, 
        name: "Patties", 
        desc: "Crispy golden baked puff patties with potato filling", 
        price: 30, 
        image: PATTIES_IMAGE 
      },
      { 
        id: 2, 
        name: "Burger", 
        desc: "Fresh bun with vegetable patty, crunchy onions & creamy sauces", 
        price: 40, 
        image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&auto=format&fit=crop&q=80" 
      },
      { 
        id: 3, 
        name: "Stuffed Patties", 
        desc: "Extra loaded baked puff pastry with special spiced stuffing", 
        price: 40, 
        image: PATTIES_IMAGE 
      },
      { 
        id: 4, 
        name: "Chowmein (Half Plate)", 
        desc: "Stir-fried street noodles tossed with cabbage, capsicum & sauces", 
        price: 30, 
        image: "https://images.unsplash.com/photo-1585032226651-759b368d7246?w=500&auto=format&fit=crop&q=80" 
      },
      { 
        id: 5, 
        name: "Chowmein (Full Plate)", 
        desc: "Full portion spicy noodles tossed with garden fresh veggies", 
        price: 70, 
        image: "https://images.unsplash.com/photo-1585032226651-759b368d7246?w=500&auto=format&fit=crop&q=80" 
      },
      { 
        id: 6, 
        name: "Chilli Potato", 
        desc: "Crispy potato fries glazed in spicy sweet honey chilli gravy with sesame", 
        price: 70, 
        image: CHILLI_POTATO_IMAGE 
      },
      { 
        id: 7, 
        name: "Maggi", 
        desc: "Hot & savory 2-minute classic masala noodles with spices", 
        price: 50, 
        image: "https://images.unsplash.com/photo-1612927601601-6638404737ce?w=500&auto=format&fit=crop&q=80" 
      }
    ];

    let cart = {};

    function renderMenu() {
      const grid = document.getElementById('menuGrid');
      grid.innerHTML = '';

      products.forEach(item => {
        const qty = cart[item.id] || 0;
        
        let actionHTML = '';
        if (qty === 0) {
          actionHTML = `<button class="add-btn" onclick="addToCart(${item.id})">+ Add</button>`;
        } else {
          actionHTML = `
            <div class="qty-controls">
              <button class="btn-qty" onclick="changeQty(${item.id}, -1)">-</button>
              <span class="qty-num">${qty}</span>
              <button class="btn-qty" onclick="changeQty(${item.id}, 1)">+</button>
            </div>
          `;
        }

        grid.innerHTML += `
          <div class="card">
            <div>
              <img src="${item.image}" alt="${item.name}" class="card-img" onerror="this.src='https://placehold.co/300x200?text=Fast+Food'">
              <span class="tag">Fast Food</span>
              <div class="item-name">${item.name}</div>
              <div class="item-desc">${item.desc}</div>
            </div>
            <div class="price-action">
              <span class="price">₹${item.price}</span>
              ${actionHTML}
            </div>
          </div>
        `;
      });

      updateCartDisplay();
    }

    function addToCart(id) {
      cart[id] = 1;
      renderMenu();
    }

    function changeQty(id, delta) {
      const updated = (cart[id] || 0) + delta;
      if (updated > 0) {
        cart[id] = updated;
      } else {
        delete cart[id];
      }
      renderMenu();
    }

    function updateCartDisplay() {
      let count = 0;
      let total = 0;

      for (const id in cart) {
        const item = products.find(p => p.id == id);
        count += cart[id];
        total += item.price * cart[id];
      }

      if (count > 0) {
        document.getElementById('cartBar').style.display = 'flex';
        document.getElementById('totalItems').innerText = count;
        document.getElementById('totalPrice').innerText = total;
      } else {
        document.getElementById('cartBar').style.display = 'none';
      }
    }

    function openOrderModal() {
      let summaryText = "";
      let orderItemsString = "";
      let total = 0;

      for (const id in cart) {
        const item = products.find(p => p.id == id);
        const subtotal = item.price * cart[id];
        summaryText += `<div>${item.name} x ${cart[id]} = <b>₹${subtotal}</b></div>`;
        orderItemsString += `${item.name} (Qty: ${cart[id]}), `;
        total += subtotal;
      }

      summaryText += `<hr style="margin: 8px 0; border: none; border-top: 1px solid #ddd;"><div style="font-size: 15px; font-weight: bold;">Grand Total: ₹${total}</div>`;
      
      document.getElementById("orderSummaryText").innerHTML = summaryText;
      document.getElementById("hiddenOrderDetails").value = orderItemsString;
      document.getElementById("hiddenTotalBill").value = "₹" + total;
      document.getElementById("orderModal").style.display = "flex";
    }

    function closeOrderModal() {
      document.getElementById("orderModal").style.display = "none";
    }

    const form = document.getElementById("orderForm");
    form.addEventListener("submit", async function(e) {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.innerText = "Placing Order...";
      btn.disabled = true;

      const data = new FormData(form);
      const action = form.action;

      try {
        const res = await fetch(action, {
          method: "POST",
          body: data,
          headers: { 'Accept': 'application/json' }
        });
        if (res.ok) {
          alert("Order Placed Successfully! Triple S Cafe has received your order and will contact you shortly.");
          cart = {};
          closeOrderModal();
          renderMenu();
        } else {
          alert("Unable to send order right now. Please ensure your Formspree ID is set up correctly.");
        }
      } catch (err) {
        alert("Network error. Please check your internet connection.");
      } finally {
        btn.innerText = "Confirm & Send Order";
        btn.disabled = false;
      }
    });

    // Initial Load
    renderMenu();
  </script>
</body>
</html>
